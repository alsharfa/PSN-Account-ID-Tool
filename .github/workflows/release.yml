name: Build and Publish Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Prepare build folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item app\PSNAccountIDTool.ps1 installer\PSNAccountIDTool.ps1
          Copy-Item app\Launch.vbs installer\Launch.vbs

      - name: Build uninstaller
        shell: pwsh
        working-directory: installer
        run: |
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o PSNAccountIDTool_Uninstall.exe uninstaller.go

      - name: Build Windows installer
        shell: pwsh
        working-directory: installer
        run: |
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ..\dist\PSN_Account_ID_Tool_Setup_v1.0.exe installer.go

      - name: Package source and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source-package\app | Out-Null
          New-Item -ItemType Directory -Force -Path source-package\installer | Out-Null
          New-Item -ItemType Directory -Force -Path source-package\.github\workflows | Out-Null

          Copy-Item README.md, LICENSE source-package\
          Copy-Item app\PSNAccountIDTool.ps1, app\Launch.vbs source-package\app\
          Copy-Item installer\installer.go, installer\uninstaller.go, installer\README.txt source-package\installer\
          Copy-Item .github\workflows\release.yml source-package\.github\workflows\

          Compress-Archive -Path source-package\* -DestinationPath dist\PSN_Account_ID_Tool_v1.0_Source.zip -Force

          $hash = (Get-FileHash dist\PSN_Account_ID_Tool_Setup_v1.0.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PSN_Account_ID_Tool_Setup_v1.0.exe" | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSN-Account-ID-Tool-v1.0
          path: |
            dist/PSN_Account_ID_Tool_Setup_v1.0.exe
            dist/PSN_Account_ID_Tool_v1.0_Source.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub release v1.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0'
          $assets = @(
            'dist\PSN_Account_ID_Tool_Setup_v1.0.exe',
            'dist\PSN_Account_ID_Tool_v1.0_Source.zip',
            'dist\SHA256SUMS.txt'
          )

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          }
          else {
            gh release create $tag $assets `
              --target $env:GITHUB_SHA `
              --title 'PSN Account ID Tool v1.0.0' `
              --notes 'Windows installer for PSN Account ID Tool. Retrieves and converts PSN Account IDs for Chiaki/chiaki-ng and PSPlay/PXPlay. The executable is not code-signed, so Windows SmartScreen may show an unknown publisher warning.' `
              --latest
          }
